services:
  - type: web
    name: project-tracker
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: DATABASE_URL
        value: /opt/render/project/src/data/tracker.db
    # Persistent disk — required to keep data across deploys.
    # Free plan does not support disks; upgrade to Starter ($7/mo) to enable.
    # Without this, the DB resets on every deploy (migrations + admin re-seeded automatically).
    disk:
      name: tracker-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
